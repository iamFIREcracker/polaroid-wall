server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Everything under static/ is content-hashed by webpack, so it can be
    # cached forever; the entry points must never be served stale (the app
    # registers a service worker, which happily hangs on to an old bundle).
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /service-worker.js {
        add_header Cache-Control "no-store";
    }

    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
