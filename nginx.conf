server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Everything under static/ is content-hashed by webpack, so it can be
    # cached forever; the entry points must never be served stale (the app
    # registers a service worker, which happily hangs on to an old bundle).
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /service-worker.js {
        add_header Cache-Control "no-store";
    }

    # The wall's content lives on the ONCE persistent volume instead of in the
    # image, so pictures and config can be replaced without a rebuild.  `root`
    # rather than `alias` because the URI prefix and the directory name match,
    # and neither location inherits the SPA `try_files`, so a picture that is
    # not there 404s instead of quietly returning index.html.
    location = /config.js {
        root /storage;
        add_header Cache-Control "no-store";
    }

    location /images/ {
        root /storage;
    }
}
